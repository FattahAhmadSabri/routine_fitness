<section class="bmi-form-card">
  <div class="form-heading">
    <div>
      <span class="form-eyebrow">HEALTH TRACKER</span>
      <h2>Update your measurements</h2>
      <p>Keep your health records up to date.</p>
    </div>
    <div class="form-icon">⚖</div>
  </div>

  <form id="bmiForm">
    <div class="form-group">
      <label>Height</label>

      <div class="height-inputs">
        <div class="input-wrapper">
          <input
            type="number"
            id="heightFeet"
            placeholder="5"
            min="1"
            max="8"
            required
          />
          <span>ft</span>
        </div>

        <div class="input-wrapper">
          <input
            type="number"
            id="heightInches"
            placeholder="5"
            min="0"
            max="11"
            required
          />
          <span>in</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="weight">Weight</label>
      <div class="input-wrapper">
        <input
          type="number"
          id="weight"
          name="weight"
          placeholder="Enter weight"
          value="80"
          min="10"
          max="500"
          step="0.1"
          required
        />
        <span>kg</span>
      </div>
    </div>

    <div class="bmi-preview">
      <span>Your calculated BMI</span>
      <strong id="bmiPreview">29.0</strong>
      <small id="bmiCategory">Overweight</small>
    </div>

    <button type="submit" class="save-bmi-btn">
      Save measurements <span>→</span>
    </button>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../config/api.js"></script>
    <script src="./bmi-form.js"></script>
  </form>
</section>
