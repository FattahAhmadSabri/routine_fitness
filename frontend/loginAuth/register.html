<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Create your Nova account." />

    <title>Register | Nova</title>

    <link rel="stylesheet" href="register.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="login-container">
      <section class="login-card">
        <div class="logo">N<span>.</span></div>

        <div class="heading">
          <h1>Create account</h1>
          <p>Enter your details to get started.</p>
        </div>

        <form id="registerForm">
          <!-- Name -->
          <div class="form-group">
            <label for="name">Full name</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              minlength="2"
              maxlength="50"
              autocomplete="name"
              required
            />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>

          <!-- Age and Gender -->
          <div class="form-row">
            <div class="form-group">
              <label for="age">Age</label>

              <input
                type="number"
                id="age"
                name="age"
                placeholder="Your age"
                min="1"
                step="1"
                required
              />
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>

              <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
              />

              <button
                type="button"
                class="toggle-password"
                data-target="password"
              >
                Show
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>

            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="toggle-password"
                data-target="confirmPassword"
              >
                Show
              </button>
            </div>
          </div>

          <!-- Terms -->
          <div class="remember-row">
            <label>
              <input type="checkbox" id="terms" required />
              I agree to the Terms & Conditions
            </label>
          </div>

          <!-- Submit -->
          <button type="submit" id="registerBtn" class="login-btn">
            <span id="btnText">Create account</span>

            <span id="loader" class="loader hidden"></span>
          </button>

          <p id="message" role="alert" aria-live="polite"></p>
        </form>

        <p class="signup-text">
          Already have an account?
          <a href="index.html">Sign in</a>
        </p>
      </section>

      <footer class="footer-text">© 2026 Nova. All rights reserved.</footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>

    <script src="../config/api.js"></script>

    <script src="./register.js"></script>
  </body>
</html>
