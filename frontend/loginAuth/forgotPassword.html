<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Routine</title>
    <link rel="stylesheet" href="forgotPassword.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <a href="./index.html" class="back-link"> ← Back to Login </a>

        <div class="logo">R<span>.</span></div>

        <div class="lock-icon">🔐</div>

        <div class="heading">
          <h1>Forgot Password?</h1>
          <p>
            Enter your registered email address. We'll send you a link to reset
            your password.
          </p>
        </div>

        <form id="forgotForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <button type="submit" class="reset-btn" id="submitBtn">
            Send Reset Link
          </button>

          <p id="message"></p>
        </form>

        <div class="signup-text">
          Remember your password?
          <a href="login.html">Sign In</a>
        </div>

        <div class="footer-text">© 2026 Routine. All rights reserved.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../config/api.js"></script>
    <script src="forgotPassword.js"></script>
  </body>
</html>
